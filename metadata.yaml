name: arknights_query
display_name: 明日方舟查询
desc: "v1.2.10 修复「干员查不到/查到别的干员」：① 名称解析改为「真名精确匹配 → 英文名 → 代号（别名）表」，此前代号表优先，一旦表里存了与真名同名的错记录（如「克莱门莎 → 莎草」），该干员就被永久遮蔽——查克莱门莎永远返回莎草的材料；② 代号登记改用精确校验（规范名必须与游戏内名称完全一致，代号本身不能是已存在的规范名），杜绝旧逻辑用模糊匹配把「查不到的名字」悄悄登记成相似干员；③ 代号管理补齐「改+删」：新增 update 动作（只改已存在的代号）、register 明确覆盖语义、query 标记目标已失效的错记录；④ 修复删除的默认代号会被重新写回（显式删除记入别名文件 _removed 键，加载时跳过，重新登记时清除）。v1.2.9 修复模组描述占位符与富文本标签未处理（卡片直显 {atk_scale_m:0%}、<@ba.vup> 会吞掉后文）、召唤物/潜能/简介/关卡条件同类标签残留，以及结城理天赋候选为空导致详情查询报错；明日方舟游戏数据查询：干员详情/精英化专精材料/技能详情/召唤物/模组/皮肤/敌方单位/关卡地图/术语地形/公开招募。数据自动从 gitee 拉取，支持 Agent 主动调用并发送查询图片。v1.2.8 修复模组查询返回空白图：模板读 item.info.material_icon，而 uniequip_table 的 itemCost 只有 {id,count,type}，Vue 渲染时读 undefined 抛错导致整张卡只剩背景（实测所有 5356 条材料条目均缺 info，386 个干员受影响）；现由数据层从 item_table 补 material_name/material_icon，模板加 v-if 防御。v1.2.7 修复数据永不更新：解压判据由「目录是否存在」改为「gamedata.zip 内数据版本 vs 已解压版本」——zip 每次拉取都会更新，但解压目录一直存在，旧逻辑导致数据永远停在首次解压的版本；解压改为临时目录+整体替换，并持有跨插件更新锁"
help: "对机器人说「查一下干员 银灰」「棘刺专精材料」「银灰的模组」「W 的皮肤」「查询敌人 爱国者」「1-7 怎么打」「晕眩是什么意思」「帮我查公招」或发送公招界面截图，或让 Agent 直接调用工具"
