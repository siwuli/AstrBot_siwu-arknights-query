name: arknights_query
display_name: 明日方舟查询
desc: "v1.2.12 公招组合图按「保底」过滤：只推荐公招池里最低也能出 4★ 的组合（每组头部标「保底★N / 最高★N」），单挂「输出」「群攻」「术师」「近战位」这类保底仅 1~3★ 的词条不再进图——上游原版会把它们连同 4★ 以上干员一起列出，看着像推荐、且图又长又空（实测 18 组/15MB → 10 组/6.8MB）。v1.2.11 代号（黑话）表改存插件配置：代号表由独立文件 data/arknights_query/aliases.json 迁到插件配置项 akq_alias_operator / akq_alias_enemy（面板「插件配置」里可直接网页增删改，旧文件首次加载自动并入并归档为 .merged），AI 自己修正的映射即时写回配置、刷新面板可见；并让 AI 学会自己修表——用户纠正查询对象（如「我问的是克莱门莎，不是莎草」）时，Agent 会按引导先 query 找到错记录，再自行判断 update 改正或 remove 删除后重新出图，不必用户说「删除/修改」，摘要里也会点明名称来自哪条代号。v1.2.10 修复「干员查不到/查到别的干员」：① 名称解析改为「真名精确匹配 → 英文名 → 代号（别名）表」，此前代号表优先，一旦表里存了与真名同名的错记录（如「克莱门莎 → 莎草」），该干员就被永久遮蔽——查克莱门莎永远返回莎草的材料；② 代号登记改用精确校验（规范名必须与游戏内名称完全一致，代号本身不能是已存在的规范名），杜绝旧逻辑用模糊匹配把「查不到的名字」悄悄登记成相似干员；③ 代号管理补齐「改+删」：新增 update 动作（只改已存在的代号）、register 明确覆盖语义、query 标记目标已失效的错记录；④ 修复删除的默认代号会被重新写回。v1.2.9 修复模组描述占位符与富文本标签未处理（卡片直显 {atk_scale_m:0%}、<@ba.vup> 会吞掉后文）、召唤物/潜能/简介/关卡条件同类标签残留，以及结城理天赋候选为空导致详情查询报错；明日方舟游戏数据查询：干员详情/精英化专精材料/技能详情/召唤物/模组/皮肤/敌方单位/关卡地图/术语地形/公开招募。数据自动从 gitee 拉取，支持 Agent 主动调用并发送查询图片。v1.2.8 修复模组查询返回空白图：模板读 item.info.material_icon，而 uniequip_table 的 itemCost 只有 {id,count,type}，Vue 渲染时读 undefined 抛错导致整张卡只剩背景（实测所有 5356 条材料条目均缺 info，386 个干员受影响）；现由数据层从 item_table 补 material_name/material_icon，模板加 v-if 防御。v1.2.7 修复数据永不更新：解压判据由「目录是否存在」改为「gamedata.zip 内数据版本 vs 已解压版本」——zip 每次拉取都会更新，但解压目录一直存在，旧逻辑导致数据永远停在首次解压的版本；解压改为临时目录+整体替换，并持有跨插件更新锁"
help: "对机器人说「查一下干员 银灰」「棘刺专精材料」「银灰的模组」「W 的皮肤」「查询敌人 爱国者」「1-7 怎么打」「晕眩是什么意思」「帮我查公招」或发送公招界面截图，或让 Agent 直接调用工具"
